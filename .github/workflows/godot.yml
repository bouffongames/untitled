name: godot

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: 

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  import:
    name: Import Assets
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
                    
      - name: Import and save asset cache
        uses: ./.github/actions/godot-import
  
  export:
    name: ${{ matrix.name }} Export
    runs-on: ubuntu-latest
    needs: import
    container:
      image: barichello/godot-ci:4.7.2
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            artifact_name: linux
            preset_name: "Itch.io Linux Desktop"
            output_dir: .bin/linux
            output_path: .bin/linux/untitled.x86_64

          - name: Windows
            artifact_name: windows
            preset_name: "Itch.io Windows Desktop"
            output_dir: .bin/windows
            output_path: .bin/windows/untitled.exe
  
          - name: Web
            artifact_name: web
            preset_name: "Itch.io Web"
            output_dir: .bin/web
            output_path: .bin/web/index.html
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
  
      - name: Setup export templates
        uses: ./.github/actions/godot-export-templates
        with:
          godot-version: ${{ env.GODOT_VERSION }}
  
      - name: Restore imported asset cache
        uses: ./.github/actions/godot-import-restore

      - name: Update Godot build number
        uses: ./.github/actions/godot-build-number
  
      - name: Build
        run: |
          mkdir -v -p "${{ matrix.output_dir }}"
          godot --headless --verbose --export-release "${{ matrix.preset_name }}" "${{ matrix.output_path }}"
  
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_dir }}
          retention-days: 1
          
      - name: Deploy to itch.io
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push ${{ matrix.output_dir }} ${{ secrets.ITCHIO_USERNAME }}/${{ secrets.ITCHIO_GAME }}:${{ matrix.artifact_name }} --userversion-file buildnumber.txt
